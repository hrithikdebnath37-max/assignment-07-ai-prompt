<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Prompt Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {

            width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .2);

        }

        h1 {

            text-align: center;
            margin-bottom: 20px;

        }

        textarea {

            width: 100%;
            height: 180px;
            padding: 15px;
            resize: none;
            font-size: 16px;

        }

        button {

            margin-top: 15px;
            padding: 12px 25px;
            background: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;

        }

        button:hover {

            background: #084298;

        }

        .result {

            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            line-height: 1.7;

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>AI Prompt Generator</h1>

        <form action="/ai" method="POST">

            <textarea name="prompt" placeholder="Write your prompt here..." required></textarea>

            <br>

            <button type="submit">
                Generate Response
            </button>

        </form>

        <div class="result">

            __RESULT__

        </div>

    </div>

</body>

</html>
