<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        .container {
            width: 700px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            resize: none;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 6px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>AI Prompt Web Application</h1>

        <form method="POST" action="/ai">

            <textarea name="prompt" placeholder="Write your prompt here..."></textarea>

            <button type="submit">

                Generate AI Response

            </button>

        </form>

        <div class="result">

            __RESULT__

        </div>

    </div>

</body>

</html>
